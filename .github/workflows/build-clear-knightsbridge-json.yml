name: Build clear Knightsbridge product images

on:
  workflow_dispatch:
    inputs:
      workers:
        description: "Concurrent lookups (4-8 recommended)"
        required: false
        default: "6"

permissions:
  contents: read

jobs:
  build-json:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Check out product data
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install image resolver dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow

      - name: Rebuild Knightsbridge image URLs
        run: |
          python refresh_knightsbridge_images.py \
            --input ews-products.json \
            --output ews-products.json \
            --report knightsbridge-image-refresh-report.json \
            --workers "${{ inputs.workers }}"

      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('ews-products.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          knight = [x for x in data if x.get('brand') == 'Knightsbridge']
          fixed = [x for x in knight if x.get('imageMapping') == 'knightsbridge-clear-verified-product-photo']
          print(f'Total products: {len(data)}')
          print(f'Knightsbridge rows: {len(knight)}')
          print(f'Rows with verified clear image: {len(fixed)}')
          assert isinstance(data, list) and data
          PY

      - name: Upload finished JSON
        uses: actions/upload-artifact@v4
        with:
          name: ews-products-knightsbridge-clear
          if-no-files-found: error
          retention-days: 14
          path: |
            ews-products.json
            knightsbridge-image-refresh-report.json
